<!DOCTYPE html>
<html>

<head>
    <title>String and Math Functions</title>
</head>

<body><label>Enter a string:</label><br><input type="text" id="str1"><br><br><label>Enter number:</label><br><input
        type="number" id="id1"><br><br><label>Enter power:</label><br><input type="number" id="id2"><br><br><button
        onclick="calculate()">Get Result</button>
    <p>Length of the String: <input id="strlen" readonly></p>
    <p>Slice String: <input id="strsli" readonly></p>
    <p>Power of a number: <input id="ans" readonly></p>
    <p>Square root: <input id="sqr" readonly></p>
    <p>Ceil: <input id="ceil" readonly></p>
    <p>Floor: <input id="floor" readonly></p>
    <script>function calculate() { let s = document.getElementById('str1').value, a = Number(document.getElementById('id1').value), b = Number(document.getElementById('id2').value); document.getElementById('strlen').value = s.length; document.getElementById('strsli').value = s.slice(5, 11); document.getElementById('ans').value = Math.pow(a, b); document.getElementById('sqr').value = Math.sqrt(a); document.getElementById('ceil').value = Math.ceil(a); document.getElementById('floor').value = Math.floor(a) }</script>
</body>

</html>
