<!DOCTYPE html><html><head><title>Registration Validation</title><script>function check(e){e.preventDefault();let name=document.getElementById('name').value.trim(),user=document.getElementById('user').value.trim(),email=document.getElementById('mail').value.trim(),p=document.getElementById('pswd').value,cp=document.getElementById('cpswd').value;if(!name){alert('Please enter your name');return}if(!user){alert('Please enter a username');return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Please enter a valid email address');return}if(!p||!cp){alert('Please enter your password');return}if(p!==cp){alert('Password does not match');return}alert('Registration successful')}</script></head><body><center><h1><u>REGISTRATION</u></h1><form onsubmit="check(event)">Name: <input id="name"><br><br>Username: <input id="user"><br><br>Email: <input type="email" id="mail"><br><br>Password: <input type="password" id="pswd"><br><br>Confirm password: <input type="password" id="cpswd"><br><br><input type="submit" value="Submit"> <input type="reset"></form></center></body></html>
